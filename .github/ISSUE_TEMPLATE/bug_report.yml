name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. French or English, both are fine.
        If the screen is stuck warm right now, run `Ocre.exe /reset` first (see the
        [troubleshooting guide](https://github.com/kovarci/ocre/blob/main/docs/en/troubleshooting.md)).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: dropdown
    id: install
    attributes:
      label: How did you install Ocre?
      options:
        - Installer (Ocre-x.y.z-setup.exe)
        - Zip archive (install.ps1)
        - From source (AutoHotkey)
    validations:
      required: true
  - type: textarea
    id: diag
    attributes:
      label: Diagnostic
      description: |
        Open **Settings > About > Copy diagnostic**, or run `Ocre.exe /diag` in a terminal,
        and paste the result. It lists the version, Windows build, screens and the state of
        the settings that matter. It contains no personal data.
      render: text
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Screenshots, `erreurs.log` from `%APPDATA%\Ocre`, other colour tools you run (f.lux, Twinkle Tray, ...).
